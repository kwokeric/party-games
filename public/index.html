<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Party Games</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="stylesheet" href="/normalize.css" />
    <link rel="stylesheet" href="/shared/app-shell.css" />
    <link rel="stylesheet" href="/home.css" />
  </head>
  <body>
    <div class="app-topbar">
      <span class="app-topbar-dot"></span>
      <span class="app-topbar-word">PARTY GAMES</span>
    </div>
    <main class="home-page">
      <div class="app-shell">
        <div class="app-pagehead">
          <div class="app-pagehead-left">
            <div class="app-pagehead-titles">
              <h1>Party Games</h1>
              <p>Pick a game and start playing with friends</p>
            </div>
          </div>
        </div>

        <section class="join-section">
          <h2>Join a room</h2>
          <div class="join-row">
            <input
              id="join-name"
              class="home-input"
              type="text"
              placeholder="Your name"
              autocomplete="off"
              maxlength="20"
            />
            <input
              id="join-code"
              class="home-input"
              type="text"
              placeholder="CODE"
              maxlength="4"
              autocomplete="off"
              autocapitalize="characters"
            />
          </div>
          <button id="join-btn" class="home-btn join-btn" type="button">Join a room</button>
          <p id="join-error" class="error"></p>
        </section>

        <hr class="section-divider" />

        <section class="games-section">
          <h2>Games</h2>
          <div id="games" class="game-grid"></div>
        </section>
      </div>
    </main>
    <script type="module" src="/home.js"></script>
  </body>
</html>
