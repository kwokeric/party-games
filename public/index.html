<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Party Games</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="stylesheet" href="/normalize.css" />
    <link rel="stylesheet" href="/home.css" />
  </head>
  <body>
    <main class="home-page">
      <div class="home-header">
        <h1>Party Games</h1>
      </div>

      <section class="join-section">
        <h2>Join a Room</h2>
        <div class="join-row">
          <input
            id="join-name"
            class="home-input"
            type="text"
            placeholder="Your name"
            autocomplete="off"
            maxlength="20"
          />
          <input
            id="join-code"
            class="home-input"
            type="text"
            placeholder="CODE"
            maxlength="4"
            autocomplete="off"
            autocapitalize="characters"
          />
        </div>
        <button id="join-btn" class="home-btn join-btn" type="button">Join Room</button>
        <p id="join-error" class="error"></p>
      </section>

      <div class="divider">
        <div class="line"></div>
        <span>or</span>
        <div class="line"></div>
      </div>

      <section class="games-section">
        <h2>Games</h2>
        <div id="games" class="game-grid"></div>
      </section>
    </main>
    <script type="module" src="/home.js"></script>
  </body>
</html>
