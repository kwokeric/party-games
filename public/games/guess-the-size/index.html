<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guess the Size</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="stylesheet" href="/normalize.css" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="./game.css" />
  </head>
  <body>
    <main class="page game-page">
      <header class="game-header">
        <h1>Guess the Size</h1>
        <span>Room: <strong id="room-code">-</strong></span>
        <span id="connection-status">Connecting…</span>
      </header>

      <section class="players-panel">
        <h2>Players</h2>
        <ul id="player-list"></ul>
      </section>

      <section id="lobby-view" class="view">
        <p id="lobby-message">Waiting for the host to start a round.</p>
        <button id="start-btn" hidden>Start round</button>
      </section>

      <section id="guessing-view" class="view" hidden>
        <p>
          Reference: <strong id="object-a-name"></strong> is exactly
          <strong id="object-a-size"></strong>. Drag the handle to resize
          <strong id="object-b-name"></strong> to what you think its real size is.
        </p>
        <div class="stage-toolbar">
          <span id="guess-readout">Your guess: - </span>
          <span class="zoom-controls">
            <button id="zoom-out" type="button" aria-label="Zoom out">&minus;</button>
            <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
          </span>
          <button id="submit-btn" type="button">Submit guess</button>
        </div>
        <div id="stage" class="stage">
          <div class="baseline"></div>
          <div id="object-a" class="obj">
            <img id="object-a-img" alt="" />
            <span class="obj-label" id="object-a-stage-label"></span>
          </div>
          <div id="object-b" class="obj">
            <img id="object-b-img" alt="" />
            <span class="obj-label" id="object-b-stage-label"></span>
            <div id="resize-handle" class="resize-handle"></div>
          </div>
        </div>
        <p id="waiting-message" class="waiting-message" hidden>
          Guess submitted — waiting for other players…
        </p>
      </section>

      <section id="reveal-view" class="view" hidden>
        <div id="reveal-stage" class="stage">
          <div class="baseline"></div>
          <div id="reveal-true-line" class="true-line">
            <span id="reveal-true-label"></span>
          </div>
          <div id="reveal-object-b-guess" class="obj obj-guess">
            <img id="reveal-guess-img" alt="" />
          </div>
          <div id="reveal-object-b-true" class="obj obj-true">
            <img id="reveal-true-img" alt="" />
          </div>
        </div>
        <p id="reveal-summary"></p>
        <h2>Results</h2>
        <ol id="results-list"></ol>
        <button id="play-again-btn" type="button" hidden>Play again</button>
      </section>
    </main>
    <script type="module" src="./client.js"></script>
  </body>
</html>
